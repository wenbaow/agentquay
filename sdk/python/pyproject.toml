[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentquay-sdk"
version = "0.3.4"
description = "AgentQuay Python SDK — 让 AI Agent 通过 MCP 发现并调用你的桌面应用方法"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AgentQuay" }]
keywords = ["mcp", "agent", "desktop", "ai", "tool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["websockets>=12.0"]

[project.optional-dependencies]
keyring = ["keyring>=24"]
pydantic = ["pydantic>=2"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/wenbaow/agentquay"
Repository = "https://github.com/wenbaow/agentquay"

[tool.setuptools]
packages = ["agentquay"]

[tool.setuptools.package-data]
# 内嵌 Bridge 二进制目录（三平台产物，随 wheel 分发；未构建时为空占位）
agentquay = ["bridge_bin/*", "py.typed"]
